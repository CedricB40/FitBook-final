<section class="connexion">
  <h1>Connexion</h1>
  <p class="intro">Content de te revoir sur FitBook.</p>

  @if (erreurGenerale()) {
    <p class="message message-erreur">{{ erreurGenerale() }}</p>
  }

  <form [formGroup]="formulaire" (ngSubmit)="envoyer()" novalidate>
    <div class="champ">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      @if (erreur('email')) {
        <p class="erreur">{{ erreur('email') }}</p>
      }
    </div>

    <div class="champ">
      <label for="motDePasse">Mot de passe</label>
      <input id="motDePasse" type="password" formControlName="motDePasse" autocomplete="current-password" />
      @if (erreur('motDePasse')) {
        <p class="erreur">{{ erreur('motDePasse') }}</p>
      }
    </div>

    <button type="submit" [disabled]="envoi()">
      @if (envoi()) {
        Connexion en cours...
      } @else {
        Se connecter
      }
    </button>
  </form>
</section>

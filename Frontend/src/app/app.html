<header class="entete">
  <span class="logo">FitBook</span>
  <nav class="menu">
    <a routerLink="/seances" routerLinkActive="actif">Séances</a>
    <a routerLink="/salles" routerLinkActive="actif">Salles</a>
    <a routerLink="/coachs" routerLinkActive="actif">Coachs</a>
    <a routerLink="/activites" routerLinkActive="actif">Activités</a>
    @if (auth.estSportif()) {
      <a routerLink="/reservations" routerLinkActive="actif">Mes réservations</a>
    }
    @if (auth.estCoach()) {
      <a routerLink="/tableau-de-bord" routerLinkActive="actif">Tableau de bord</a>
    }
    @if (auth.estConnecte()) {
      <span class="identite">{{ auth.utilisateur()?.username ?? auth.utilisateur()?.email }}</span>
      <button type="button" class="deconnexion" (click)="deconnecter()">Déconnexion</button>
    } @else {
      <a routerLink="/inscription" routerLinkActive="actif">Inscription</a>
      <a routerLink="/connexion" routerLinkActive="actif">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

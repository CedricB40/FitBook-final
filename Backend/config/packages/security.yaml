security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        login:
            pattern: ^/api/login_check$
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: motDePasse
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login_check$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/activites$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/(salles|coachs|cours|seances|recherche)(/\d+)?$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/seances/\d+/places$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/avis/(salle|coach|cours)/\d+$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/gestionnaire, roles: ROLE_GESTIONNAIRE }
        - { path: ^/api/coach, roles: ROLE_COACH }
        - { path: ^/api/sportif, roles: ROLE_SPORTIF }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10